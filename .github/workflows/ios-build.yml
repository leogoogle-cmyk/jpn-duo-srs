name: Build iOS IPA
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js (2026 Node24 Standard)
      uses: actions/setup-node@v4
      with:
        node-version: 24
        
    - name: Install Dependencies
      run: |
        npm install
        
    - name: Web App Production Build
      run: |
        npm run build
        
    - name: Force Capacitor Sync
      run: |
        npx cap sync ios
        
    - name: Compile Unsigned App Package via Xcode CLI
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build PROVISIONING_PROFILE_SPECIFIER=""
        
    - name: Compress App Package into IPA Structure
      run: |
        mkdir -p Payload
        if [ -d "ios/App/build/Debug-iphoneos/App.app" ]; then
          cp -r ios/App/build/Debug-iphoneos/App.app Payload/
        else
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-iphoneos/App.app Payload/
        fi
        zip -r JpnDuoSRS_Unsigned.ipa Payload
        
    - name: Export Output IPA Archive
      uses: actions/upload-artifact@v4
      with:
        name: JpnDuoSRS-iOS-Package
        path: JpnDuoSRS_Unsigned.ipa
