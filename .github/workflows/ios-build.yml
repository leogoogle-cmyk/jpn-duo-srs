name: Build iOS Web Archive
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js (Node24 Standard)
      uses: actions/setup-node@v4
      with:
        node-version: 24
        
    - name: Install Dependencies
      run: npm install
        
    - name: Web App Production Build (Generate SW and Assets)
      run: npm run build
        
    - name: Archive Production Build (dist folder)
      uses: actions/upload-artifact@v4
      with:
        name: JpnDuoSRS-Web-Production
        path: dist/
