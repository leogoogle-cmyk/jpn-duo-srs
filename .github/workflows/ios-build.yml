name: Build iOS IPA
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    - name: Install Dependencies
      run: |
        npm ci
    - name: Build Web App and Sync
      run: |
        npm run build
        npx cap sync ios
    - name: Build Xcode Project (Simulator Archive)
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
    - name: Create Unsigned IPA Package
      run: |
        mkdir -p Payload
        cp -r ios/App/build/Debug-iphoneos/App.app Payload/ 2>/dev/null || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-iphoneos/App.app Payload/
        zip -r JpnDuoSRS_Unsigned.ipa Payload
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JpnDuoSRS-iOS-Package
        path: JpnDuoSRS_Unsigned.ipa
